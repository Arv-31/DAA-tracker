let checked = {};
let currentUser = null;
let saveTimer = null;

function getAllIds(topics, ids = []) {
  for (const t of topics) { ids.push(t.id); if (t.sub) getAllIds(t.sub, ids); }
  return ids;
}

function showSync(state) {
  const el = document.getElementById('sync-status');
  el.className = 'sync-status ' + state;
  el.textContent = state === 'saving' ? 'saving...' : 'synced';
}

async function loadFromFirestore(uid) {
  const snap = await getDoc(doc(db, 'users', uid));
  checked = snap.exists() ? (snap.data().checked || {}) : {};
}

async function saveToFirestore() {
  if (!currentUser) return;
  showSync('saving');
  await setDoc(doc(db, 'users', currentUser.uid), { checked }, { merge: true });
  showSync('saved');
}

function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveToFirestore, 1200); }

window.signInWithGoogle = async function() {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(e) { alert('Sign in failed: ' + e.message); }
};
window.signOut = async function() { await fbSignOut(auth); };

onAuthStateChanged(auth, async (user) => {
  document.getElementById('loading-screen').style.display = 'none';
  if (user) {
    currentUser = user;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';
    document.getElementById('user-avatar').src = user.photoURL || '';
    await loadFromFirestore(user.uid);
    render();
    showSync('saved');
  } else {
    currentUser = null;
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display = 'none';
  }
});

  let html = '';
  for (const t of topics) {
    const cls = depth === 1 ? 'subtopic' : depth >= 2 ? 'subsubtopic' : '';
    html += `<li class="topic-item ${cls} ${checked[t.id] ? 'done' : ''}" id="row-${t.id}" onclick="toggle('${t.id}')">
      <div class="checkbox ${checked[t.id] ? 'checked' : ''}" id="chk-${t.id}"><div class="checkmark"></div></div>
      <span class="topic-label">${t.id}&nbsp;&nbsp;${t.text}</span>
    </li>`;
    if (t.sub) html += renderTopics(t.sub, depth + 1);
  }
  return html;
}

function render() {
  let html = '';
  for (const unit of syllabus) {
    const allIds = []; for (const ch of unit.chapters) getAllIds(ch.topics, allIds);
    const doneCount = allIds.filter(id => checked[id]).length;
    html += `<div class="unit-block" id="${unit.unit}">
      <div class="unit-header" onclick="toggleUnit('${unit.unit}')">
        <span class="unit-badge">${unit.unit.replace('-',' ')}</span>
        <span class="unit-title">${unit.label}</span>
        <span class="unit-count">${doneCount}/${allIds.length}</span>
        <span class="chevron">&#9660;</span>
      </div>
      <div class="unit-chapters">`;
    for (const ch of unit.chapters) {
      const chIds = getAllIds(ch.topics);
      const chDone = chIds.filter(id => checked[id]).length;
      html += `<div class="chapter-block" id="ch-${ch.num}">
        <div class="chapter-header" onclick="toggleChapter('ch-${ch.num}')">
          <span class="chapter-num">Ch. ${ch.num}</span>
          <span class="chapter-title">${ch.title}</span>
          <span class="chapter-prog">${chDone}/${chIds.length}</span>
          <span class="chevron">&#9660;</span>
        </div>
        <div class="chapter-topics"><ul class="topic-list">${renderTopics(ch.topics)}</ul></div>
      </div>`;
    }
    html += `</div></div>`;
  }
  document.getElementById('syllabus').innerHTML = html;
  updateProgress();
}

window.toggle = function(id) {
  checked[id] = !checked[id];
  document.getElementById('row-' + id)?.classList.toggle('done', checked[id]);
  document.getElementById('chk-' + id)?.classList.toggle('checked', checked[id]);
  updateProgress(); updateCounts(); scheduleSave();
};

function updateProgress() {
  let total = 0, done = 0;
  for (const unit of syllabus) for (const ch of unit.chapters) {
    const ids = getAllIds(ch.topics); total += ids.length;
    done += ids.filter(id => checked[id]).length;
  }
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `${done} of ${total} topics`;
  document.getElementById('prog-pct').textContent = pct + '%';
}

function updateCounts() {
  for (const unit of syllabus) {
    const allIds = []; for (const ch of unit.chapters) getAllIds(ch.topics, allIds);
    const el = document.querySelector(`#${unit.unit} .unit-count`);
    if (el) el.textContent = allIds.filter(id => checked[id]).length + '/' + allIds.length;
    for (const ch of unit.chapters) {
      const chIds = getAllIds(ch.topics);
      const cel = document.querySelector(`#ch-${ch.num} .chapter-prog`);
      if (cel) cel.textContent = chIds.filter(id => checked[id]).length + '/' + chIds.length;
    }
  }
}

window.toggleUnit = id => document.getElementById(id)?.classList.toggle('collapsed');
window.toggleChapter = id => document.getElementById(id)?.classList.toggle('chapter-collapsed');
window.checkAll = () => { for (const u of syllabus) for (const ch of u.chapters) getAllIds(ch.topics).forEach(id => checked[id] = true); render(); scheduleSave(); };
window.uncheckAll = () => { checked = {}; render(); scheduleSave(); };
window.expandAll = () => { document.querySelectorAll('.unit-block').forEach(e => e.classList.remove('collapsed')); document.querySelectorAll('.chapter-block').forEach(e => e.classList.remove('chapter-collapsed')); };
window.collapseAll = () => { document.querySelectorAll('.unit-block').forEach(e => e.classList.add('collapsed')); document.querySelectorAll('.chapter-block').forEach(e => e.classList.add('chapter-collapsed')); };
</script>
</body>
</html>
